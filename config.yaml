vault_path: "/Users/thierrycrouzet/Documents/ObsidianLocal/text/"
history_repo: ".cache/vault-history.git"
fingerprint_db: ".cache/fingerprints.sqlite3"

excluded_folders:
  - "templates"
  - ".obsidian"
  - "archives"

file_extensions: [".md"]

import_detection:
  # Percentile empirique des rythmes déjà observés sur chaque projet.
  rate_percentile: 99

internal_detection:
  gram_chars: 36
  selection_chars: 180
  overlap_threshold: 0.85

session:
  timeout_minutes: 45

output_dir: "site"
archived_projects_file: "projets_archives.yml"
