<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tableau de bord local de l'activité d'écriture">
  <title>Writing Log</title>
  <link rel="icon" href="assets/images/favicon.svg?v=20260911155842" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20260911155842">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="dashboard.js?v=20260911155842" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">W</span><div><h1>Writing Log</h1><p id="selected-project-title" hidden></p></div></div>
    <div class="toolbar">
      <label>Projet
        <select id="project-filter"><option value="all">Tous les projets</option></select>
      </label>
    </div>
  </header>

  <main>
    <p id="error" class="error" hidden></p>
    <section class="overview" aria-label="Vue d'ensemble">
      <article class="stat"><span>Signes produits</span><strong id="total-chars">—</strong></article>
      <article class="stat"><span>Projets suivis</span><strong id="project-count">—</strong></article>
    </section>

    <p class="updated">Données mises à jour <time id="last-update">—</time></p>

    <section class="chart-grid">
      <article class="panel wide">
        <header><div><h2>Production</h2><p>Texte nouveau · copies et déplacements exclus par l’analyse</p></div><div class="chart-actions"><select id="production-granularity" aria-label="Granularité de la production"><option value="day" selected>Jour</option><option value="week">Semaine</option><option value="month">Mois</option></select><select class="chart-range" data-chart="daily" aria-label="Période du graphique de production"><option value="30d" selected>30 jours</option><option value="6m">6 mois</option><option value="1y">1 an</option><option value="all">Tout</option></select><button type="button" class="chart-download" aria-label="Télécharger ce graphique" title="Télécharger ce graphique"></button></div></header>
        <div class="canvas-wrap"><canvas id="daily-chart"></canvas></div>
      </article>
      <article class="panel wide">
        <header><div><h2>Taille</h2><p>Taille logique du manuscrit · compilations et doublons exclus</p></div><div class="chart-actions"><select class="chart-range" data-chart="size" aria-label="Période de la taille du manuscrit"><option value="30d">30 jours</option><option value="6m">6 mois</option><option value="1y">1 an</option><option value="all" selected>Tout</option></select><button type="button" class="chart-download" aria-label="Télécharger ce graphique" title="Télécharger ce graphique"></button></div></header>
        <div class="canvas-wrap tall"><canvas id="size-chart"></canvas></div>
      </article>
    </section>
  </main>
  <footer>Le dashboard affiche les JSON générés par l’analyse sans reclasser les données.</footer>
</body>
</html>
